<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Instructions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="workflow-page">
  <div class="workflow-card">
    <h1>Task Instructions</h1>
    <p style="font-size:0.92rem; color:#56708f; margin-top:-8px;">
      Please read these instructions carefully before using the AI system.
    </p>
    <div style="background:#fff8e1; border:1.5px dashed #f0a500; border-radius:10px; padding:18px 20px; margin: 18px 0;">
      <p style="margin:0 0 8px; font-weight:600; color:#b07800;">
        To do: Description of the task
      </p>
    </div>
    <a id="back-to-workflow" class="btn-primary task-back-btn" href="/study-workflow.html">
      Back to Workflow
    </a>
  </div>
  <script src="script.js"></script>
  <script>
    const backToWorkflow = document.getElementById('back-to-workflow');
    const workflowParams = new URLSearchParams(window.location.search);
    const workflowQuery = workflowParams.toString();
    if (workflowQuery) {
      backToWorkflow.href = `/study-workflow.html?${workflowQuery}`;
    }
  </script>
</body>
</html>
